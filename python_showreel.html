<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Sets the character encoding -->
  <meta charset="UTF-8">
  <!-- Makes the page fit different screen sizes -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Sets the title shown in the browser tab -->
  <title>Pixielled — Python Showreel</title>
  <style>
    /* GENERAL PAGE SETTINGS */
    /* Removes the default spacing and makes sizing easier to control */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      min-height: 100vh;
      background: #7D99C9;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow-x: hidden;
      color: #000000;
      text-align: center;
      font-family: "Courier New", Courier, monospace;
      font-size: 20px;
      letter-spacing: 2px;
      word-spacing: 2px;
      line-height: 1.6;
    }
    /* OUTER BLUE FRAME */
    /* Creates the blue space around the white container */
    .portfolio-frame {
      position: relative;
      width: 100%;
      max-width: 1260px;
      padding: 30px;
    }
    /* PIXEL STAR DESIGN */
    /* Creates the small pixel-style stars used as decorations */
    .pixel-star {
      position: absolute;
      width: 18px;
      height: 18px;
      background: #F2C94C;
      /* Uses clip-path to give the stars a pixel-style shape */
      clip-path: polygon(
        50% 0%,
        62% 25%,
        75% 25%,
        75% 37%,
        100% 50%,
        75% 62%,
        75% 75%,
        62% 75%,
        50% 100%,
        37% 75%,
        25% 75%,
        25% 62%,
        0% 50%,
        25% 37%,
        25% 25%,
        37% 25%
      );
      /* Makes the stars slowly fade in and out */
      animation: star-twinkle 2s ease-in-out infinite;
      pointer-events: none;
      z-index: 2;
    }
    /* STAR POSITIONS */
    /* Places the stars along the top of the blue frame */
    .star-1 {
      top: 5px;
      left: 12%;
      animation-delay: 0s;
    }
    .star-2 {
      top: 5px;
      left: 38%;
      background: #ffffff;
      animation-delay: 0.7s;
    }
    .star-3 {
      top: 5px;
      right: 25%;
      animation-delay: 1.2s;
    }
    .star-4 {
      top: 5px;
      right: 8%;
      background: #DCDBBB;
      animation-delay: 0.4s;
    }
    /* Places two stars along the left side */
    .star-5 {
      left: 5px;
      top: 35%;
      animation-delay: 1.5s;
    }
    .star-6 {
      left: 5px;
      top: 72%;
      background: #ffffff;
      animation-delay: 0.9s;
    }
    /* Places two more stars along the right side */
    .star-7 {
      right: 5px;
      top: 30%;
      background: #ffffff;
      animation-delay: 1.8s;
    }
    .star-8 {
      right: 5px;
      top: 70%;
      animation-delay: 0.3s;
    }
    /* Adds the final stars along the bottom */
    .star-9 {
      bottom: 5px;
      left: 22%;
      background: #DCDBBB;
      animation-delay: 0.6s;
    }
    .star-10 {
      bottom: 5px;
      left: 55%;
      animation-delay: 1.4s;
    }
    .star-11 {
      bottom: 5px;
      right: 12%;
      background: #ffffff;
      animation-delay: 0.2s;
    }
    /* STAR TWINKLING ANIMATION */
    /* Changes the size and visibility of each star to create a twinkling effect */
    @keyframes star-twinkle {
      /* Keeps the stars fully visible at the start and end */
      0%, 100% {
        opacity: 1;
        transform: scale(1);
      }
      /* Makes the stars smaller and less visible halfway through */
      50% {
        opacity: 0.2;
        transform: scale(0.6);
      }
    }
    /* MAIN WHITE CONTAINER */
    .wiggly-container {
      width: 100%;
      min-height: 80vh;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 30px;
      padding: 45px 30px;
      background: #ffffff;
      /* Adds the cream-coloured border around the container */
      border: 5px solid #DCDBBB;
      /* Creates the uneven wiggly shape around the edges */
      border-radius: 45% 55% 50% 50% / 8% 10% 12% 9%;
      /* Makes the shape gently change over time */
      animation: wiggle 6s ease-in-out infinite;
    }
    /* PAGE HEADING */
    .page-title {
      color: #34496E;
      font-size: 32px;
      font-weight: bold;
      letter-spacing: 3px;
      margin-bottom: 5px;
    }
    /* Adds a smaller subtitle underneath the main heading */
    .subtitle {
      color: #7D99C9;
      font-size: 15px;
      letter-spacing: 3px;
    }
    /* SHOWREEL DESCRIPTION */
    .showreel-description {
      max-width: 750px;
      font-size: 18px;
      color: #000000;
      margin: 10px 0;
    }
    /* SHOWREEL VIDEO AREA */
    /* Creates the space where my Python showreel video will be displayed */
    .video-container {
      width: 100%;
      max-width: 800px;
      aspect-ratio: 16 / 9;
      background: #34496E;
      border: 4px solid #DCDBBB;
      border-radius: 20px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-size: 16px;
    }
    /* Makes the video fill the container without stretching it */
    .showreel-video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    /* BACK BUTTON */
    .back-button {
      display: inline-block;
      padding: 12px 30px;
      background: #7D99C9;
      color: #ffffff;
      border: 2px solid #34496E;
      border-radius: 999px;
      font-family: inherit;
      font-size: 17px;
      letter-spacing: 2px;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    /* Changes the button colour and position when hovered over */
    .back-button:hover,
    .back-button:focus-visible {
      background: #34496E;
      color: #ffffff;
      transform: translateY(-3px);
    }
    /* Adds an outline so the button is easier to see when using a keyboard */
    .back-button:focus-visible {
      outline: 3px solid #000000;
      outline-offset: 4px;
    }
    /* WIGGLY BORDER ANIMATION */
    /* Changes the border-radius values to make the container look wiggly */
    @keyframes wiggle {
      0%, 100% {
        border-radius: 45% 55% 50% 50% / 8% 10% 12% 9%;
      }
      50% {
        border-radius: 50% 45% 55% 45% / 10% 8% 9% 12%;
      }
    }
    /* MOBILE RESPONSIVENESS */
    /* Changes the layout slightly for smaller screens */
    @media (max-width: 600px) {
      body {
        padding: 12px;
        font-size: 16px;
      }
      .portfolio-frame {
        padding: 22px;
      }
      /* Makes the stars smaller so they fit better on mobile screens */
      .pixel-star {
        width: 13px;
        height: 13px;
      }
      .wiggly-container {
        min-height: 90vh;
        padding: 30px 18px;
        border-width: 4px;
        border-radius: 40% 60% 45% 55% / 6% 8% 10% 7%;
        gap: 22px;
      }
      .page-title {
        font-size: 24px;
      }
      .subtitle {
        font-size: 12px;
      }
      .showreel-description {
        font-size: 15px;
      }
      /* Makes the button easier to press on a phone */
      .back-button {
        width: 100%;
        max-width: 280px;
      }
    }
    /* REDUCED MOTION ACCESSIBILITY */
    /* Stops the animations if the user has reduced motion enabled on their device */
    @media (prefers-reduced-motion: reduce) {
      .wiggly-container {
        animation: none;
      }
      .pixel-star {
        animation: none;
      }
      .back-button {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <!-- OUTER BLUE FRAME -->
  <div class="portfolio-frame">
    <!-- These are the decorative stars around the outside of the page -->
    <span class="pixel-star star-1" aria-hidden="true"></span>
    <span class="pixel-star star-2" aria-hidden="true"></span>
    <span class="pixel-star star-3" aria-hidden="true"></span>
    <span class="pixel-star star-4" aria-hidden="true"></span>
    <span class="pixel-star star-5" aria-hidden="true"></span>
    <span class="pixel-star star-6" aria-hidden="true"></span>
    <span class="pixel-star star-7" aria-hidden="true"></span>
    <span class="pixel-star star-8" aria-hidden="true"></span>
    <span class="pixel-star star-9" aria-hidden="true"></span>
    <span class="pixel-star star-10" aria-hidden="true"></span>
    <span class="pixel-star star-11" aria-hidden="true"></span>
    <!-- MAIN WHITE CONTAINER -->
    <main class="wiggly-container">
      <!-- Main heading for my Python showreel -->
      <h1 class="page-title">
        Python Coding Showreel
      </h1>
      <!-- Small subtitle underneath the heading -->
      <p class="subtitle">
        PYTHON PROGRAMMING SHOWREEL
      </p>
      <!-- Brief description explaining what the showreel contains -->
      <p class="showreel-description">
        Python coding showreel featuring projects and programming work
        from multiple years.
      </p>
      <!-- SHOWREEL VIDEO -->
      <!-- I will add my Python showreel video here when it is ready -->
      <div class="video-container">
        Your Python showreel will go here!
      </div>
      <!-- BACK BUTTON -->
      <!-- Takes the visitor back to the main portfolio homepage -->
      <a href="index.html" class="back-button">
        ← Back to Portfolio
      </a>
    </main>
  </div>
</body>
</html>
