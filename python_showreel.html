
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Pixielled — Python Showreel</title>

  <style>
    /* Setting the main page colours and font to match my other portfolio pages */
    body {
      margin: 0;
      min-height: 100vh;
      background: #7D99C9;
      color: white;
      text-align: center;
      font-family: "Courier New", Courier, monospace;
      font-size: 18px;
      letter-spacing: 1px;
      word-spacing: 1px;
    }

    /* Keeping the main content wide and centred on the page */
    .portfolio-frame {
      position: relative;
      width: 90%;
      max-width: 1000px;
      margin: 50px auto;
      padding: 35px;
      box-sizing: border-box;
    }

    /* Creating the same white rounded rectangle used on my other pages */
    .wiggly-container {
      position: relative;
      z-index: 2;
      width: 100%;
      box-sizing: border-box;
      background: white;
      color: #7D99C9;
      border: 8px solid #DCDBBB;
      border-radius: 30px;
      padding: 45px 40px;
      animation: wiggle 6s ease-in-out infinite;
    }

    /* Making the corners move slightly without turning the container into a circle */
    @keyframes wiggle {
      0%, 100% {
        border-radius: 30px 35px 30px 35px;
      }
      50% {
        border-radius: 35px 30px 35px 30px;
      }
    }

    /* Making the heading fit neatly inside the container */
    h1 {
      font-size: clamp(22px, 4vw, 36px);
      line-height: 1.3;
      margin: 0 0 20px;
      overflow-wrap: break-word;
    }

    /* Keeping the description centred and easy to read */
    .intro-text {
      max-width: 750px;
      margin: 0 auto 30px;
      font-size: clamp(14px, 2vw, 18px);
      line-height: 1.6;
      overflow-wrap: break-word;
    }

    /* Adding a video area that keeps the correct widescreen shape */
    .video-container {
      width: 100%;
      max-width: 750px;
      aspect-ratio: 16 / 9;
      margin: 30px auto;
      background: #7D99C9;
      border: 5px solid #DCDBBB;
      border-radius: 15px;
      box-sizing: border-box;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Making sure my video fills the space without getting stretched */
    .showreel-video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* Styling the back button to match the rest of my website */
    .back-button {
      display: inline-block;
      margin-top: 15px;
      padding: 12px 25px;
      background: #7D99C9;
      color: white;
      border: 3px solid #DCDBBB;
      border-radius: 10px;
      font-family: "Courier New", Courier, monospace;
      font-size: 16px;
      letter-spacing: 1px;
      text-decoration: none;
      transition: background 0.2s ease, transform 0.2s ease;
    }

    /* Adding a small hover effect to the button */
    .back-button:hover {
      background: #617FAF;
      transform: scale(1.05);
    }

    /* Positioning the pixel stars in the blue border around the white container */
    .pixel-star {
      position: absolute;
      z-index: 3;
      width: 18px;
      height: 18px;
      background: white;
      clip-path: polygon(
        50% 0%, 61% 35%, 100% 50%,
        61% 65%, 50% 100%, 39% 65%,
        0% 50%, 39% 35%
      );
      animation: twinkle 2s ease-in-out infinite;
    }

    /* Giving each star a different position and animation delay */
    .star-one {
      top: 5px;
      left: 12%;
    }

    .star-two {
      top: 45%;
      right: 5px;
      animation-delay: 0.7s;
    }

    .star-three {
      bottom: 5px;
      left: 25%;
      animation-delay: 1.2s;
    }

    .star-four {
      bottom: 15%;
      right: 12%;
      animation-delay: 0.4s;
    }

    /* Making the stars gently blink */
    @keyframes twinkle {
      0%, 100% {
        opacity: 0.3;
        transform: scale(0.7);
      }
      50% {
        opacity: 1;
        transform: scale(1.2);
      }
    }

    /* Adjusting the spacing and text for tablet screens */
    @media (max-width: 768px) {
      .portfolio-frame {
        width: 94%;
        margin: 30px auto;
        padding: 25px;
      }

      .wiggly-container {
        padding: 35px 25px;
      }
    }

    /* Making sure the page still fits on smaller mobile screens */
    @media (max-width: 480px) {
      body {
        font-size: 15px;
      }

      .portfolio-frame {
        width: 96%;
        margin: 20px auto;
        padding: 18px;
      }

      .wiggly-container {
        padding: 28px 16px;
        border-width: 6px;
      }

      .pixel-star {
        width: 13px;
        height: 13px;
      }

      .back-button {
        font-size: 14px;
        padding: 10px 18px;
      }
    }

    /* Stopping animations for anyone who has reduced motion enabled */
    @media (prefers-reduced-motion: reduce) {
      .wiggly-container,
      .pixel-star {
        animation: none;
      }
    }
  </style>
</head>

<body>

  <main class="portfolio-frame">

    <!-- These stars sit in the blue border, not over the white container -->
    <span class="pixel-star star-one"></span>
    <span class="pixel-star star-two"></span>
    <span class="pixel-star star-three"></span>
    <span class="pixel-star star-four"></span>

    <section class="wiggly-container">

      <h1>Python Coding Showreel</h1>

      <p class="intro-text">
        Python Coding Showreel from multiple years.
      </p>

      <!-- This is the space for my Python showreel video -->
      <div class="video-container">
        <p>Your Python showreel will go here!</p>
      </div>

      <!-- This link takes the user back to my main portfolio page -->
      <a href="index.html" class="back-button">Back to Portfolio</a>

    </section>
  </main>

</body>
</html>
