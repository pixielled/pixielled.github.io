
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Pixielled — Python Showreel</title>

  <style>
    /* Using the same background colour and font as my other portfolio pages */
    body {
      margin: 0;
      min-height: 100vh;
      background: #7D99C9;
      color: white;
      text-align: center;
      font-family: "Courier New", Courier, monospace;
      font-size: 20px;
      letter-spacing: 2px;
      word-spacing: 2px;
    }

    /* This creates the blue space around my main container */
    .portfolio-frame {
      position: relative;
      width: min(90%, 1000px);
      margin: 50px auto;
      padding: 35px;
      box-sizing: border-box;
    }

    /* Keeping the original wiggly shape from my homepage and Unreal page */
    .wiggly-container {
      position: relative;
      z-index: 2;
      background: white;
      color: #7D99C9;
      border: 8px solid #DCDBBB;
      border-radius: 45% 55% 48% 52% / 55% 45% 55% 45%;
      padding: 50px 35px;
      animation: wiggle 6s ease-in-out infinite;
      box-sizing: border-box;
    }

    /* This is the original animation that gently changes the container shape */
    @keyframes wiggle {
      0%, 100% {
        border-radius: 45% 55% 48% 52% / 55% 45% 55% 45%;
      }
      50% {
        border-radius: 55% 45% 52% 48% / 45% 55% 45% 55%;
      }
    }

    /* Keeping the heading inside the container and allowing it to wrap */
    h1 {
      font-size: clamp(22px, 4vw, 36px);
      line-height: 1.3;
      overflow-wrap: break-word;
      margin: 0 0 20px;
    }

    /* Making the showreel description fit neatly underneath the heading */
    .intro-text {
      max-width: 650px;
      margin: 0 auto 30px;
      font-size: clamp(14px, 2vw, 18px);
      line-height: 1.6;
      overflow-wrap: break-word;
    }

    /* Setting up the space where my Python showreel video will go */
    .video-container {
      width: 100%;
      max-width: 750px;
      aspect-ratio: 16 / 9;
      margin: 30px auto;
      background: #7D99C9;
      border: 5px solid #DCDBBB;
      border-radius: 15px;
      box-sizing: border-box;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Making sure the video fits inside the video container */
    .showreel-video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* Styling the back button to match my other pages */
    .back-button {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 25px;
      background: #7D99C9;
      color: white;
      border: 3px solid #DCDBBB;
      border-radius: 10px;
      font-family: "Courier New", Courier, monospace;
      font-size: 16px;
      letter-spacing: 1px;
      text-decoration: none;
      transition: transform 0.2s ease, background 0.2s ease;
    }

    /* Adding a small hover effect to the back button */
    .back-button:hover {
      background: #617FAF;
      transform: scale(1.05);
    }

    /* These are the pixel stars that sit in the blue border */
    .pixel-star {
      position: absolute;
      z-index: 3;
      width: 18px;
      height: 18px;
      background: white;
      clip-path: polygon(
        50% 0%, 61% 35%, 100% 50%,
        61% 65%, 50% 100%, 39% 65%,
        0% 50%, 39% 35%
      );
      animation: twinkle 2s ease-in-out infinite;
    }

    /* Giving each star its own position around the container */
    .star-one {
      top: 5px;
      left: 12%;
    }

    .star-two {
      top: 45%;
      right: 5px;
      animation-delay: 0.7s;
    }

    .star-three {
      bottom: 5px;
      left: 25%;
      animation-delay: 1.2s;
    }

    .star-four {
      bottom: 15%;
      right: 12%;
      animation-delay: 0.4s;
    }

    /* Making the stars twinkle at different times */
    @keyframes twinkle {
      0%, 100% {
        opacity: 0.3;
        transform: scale(0.7);
      }
      50% {
        opacity: 1;
        transform: scale(1.2);
      }
    }

    /* Adjusting the layout for tablet screens */
    @media (max-width: 768px) {
      .portfolio-frame {
        width: 94%;
        margin: 30px auto;
        padding: 25px;
      }

      .wiggly-container {
        padding: 40px 25px;
      }
    }

    /* Making the page fit smaller mobile screens */
    @media (max-width: 480px) {
      body {
        font-size: 16px;
      }

      .portfolio-frame {
        width: 96%;
        margin: 20px auto;
        padding: 18px;
      }

      .wiggly-container {
        padding: 30px 18px;
        border-width: 6px;
      }

      .pixel-star {
        width: 13px;
        height: 13px;
      }

      .back-button {
        font-size: 14px;
        padding: 10px 18px;
      }
    }

    /* Turning off the animations if reduced motion is enabled */
    @media (prefers-reduced-motion: reduce) {
      .wiggly-container,
      .pixel-star {
        animation: none;
      }
    }
  </style>
</head>

<body>

  <main class="portfolio-frame">

    <!-- Placing the stars in the blue border around the white container -->
    <span class="pixel-star star-one"></span>
    <span class="pixel-star star-two"></span>
    <span class="pixel-star star-three"></span>
    <span class="pixel-star star-four"></span>

    <section class="wiggly-container">

      <h1>Python Coding Showreel</h1>

      <p class="intro-text">
        Python Coding Showreel from multiple years.
      </p>

      <!-- This is where I can add my Python showreel video -->
      <div class="video-container">
        <p>Your Python showreel will go here!</p>
      </div>

      <!-- Taking the user back to the main portfolio page -->
      <a href="index.html" class="back-button">Back to Portfolio</a>

    </section>
  </main>

</body>
</html>
