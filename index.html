
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Pixielled — Games Development</title>

  <style>

    /* ================================= */
    /* GENERAL PAGE SETTINGS             */
    /* ================================= */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: #7D99C9;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 20px;
      overflow-x: hidden;

      color: #000000;
      text-align: center;

      font-family: "Courier New", Courier, monospace;
      font-size: 18px;
      letter-spacing: 1px;
      line-height: 1.6;
    }


    /* ================================= */
    /* OUTER BLUE FRAME                   */
    /* ================================= */

    /* This creates the space around the white container.
       The blue background of the body shows through here.
       The stars are positioned inside this space. */

    .portfolio-frame {
      position: relative;

      width: 100%;
      max-width: 1260px;

      padding: 30px;
    }


    /* ================================= */
    /* PIXEL STAR DESIGN                  */
    /* ================================= */

    /* Creates a four-point pixel-style star */

    .pixel-star {
      position: absolute;

      width: 18px;
      height: 18px;

      background: #F2C94C;

      /* Creates a stepped, retro pixel-art star shape */
      clip-path: polygon(
        50% 0%,
        62% 25%,
        75% 25%,
        75% 37%,
        100% 50%,
        75% 62%,
        75% 75%,
        62% 75%,
        50% 100%,
        37% 75%,
        25% 75%,
        25% 62%,
        0% 50%,
        25% 37%,
        25% 25%,
        37% 25%
      );

      /* Makes each star blink independently */
      animation: star-twinkle 2s ease-in-out infinite;

      /* Keeps stars decorative and non-clickable */
      pointer-events: none;

      z-index: 2;
    }


    /* ================================= */
    /* STAR POSITIONS                     */
    /* ================================= */

    /* Top edge stars */

    .star-1 {
      top: 5px;
      left: 12%;
      animation-delay: 0s;
    }

    .star-2 {
      top: 5px;
      left: 38%;
      background: #ffffff;
      animation-delay: 0.7s;
    }

    .star-3 {
      top: 5px;
      right: 25%;
      animation-delay: 1.2s;
    }

    .star-4 {
      top: 5px;
      right: 8%;
      background: #DCDBBB;
      animation-delay: 0.4s;
    }


    /* Left edge stars */

    .star-5 {
      left: 5px;
      top: 35%;
      animation-delay: 1.5s;
    }

    .star-6 {
      left: 5px;
      top: 72%;
      background: #ffffff;
      animation-delay: 0.9s;
    }


    /* Right edge stars */

    .star-7 {
      right: 5px;
      top: 30%;
      background: #ffffff;
      animation-delay: 1.8s;
    }

    .star-8 {
      right: 5px;
      top: 70%;
      animation-delay: 0.3s;
    }


    /* Bottom edge stars */

    .star-9 {
      bottom: 5px;
      left: 22%;
      background: #DCDBBB;
      animation-delay: 0.6s;
    }

    .star-10 {
      bottom: 5px;
      left: 55%;
      animation-delay: 1.4s;
    }

    .star-11 {
      bottom: 5px;
      right: 12%;
      background: #ffffff;
      animation-delay: 0.2s;
    }


    /* ================================= */
    /* STAR BLINKING ANIMATION            */
    /* ================================= */

    @keyframes star-twinkle {

      /* Star fully visible */
      0%, 100% {
        opacity: 1;
        transform: scale(1);
      }

      /* Star fades and shrinks */
      50% {
        opacity: 0.2;
        transform: scale(0.6);
      }
    }


    /* ================================= */
    /* MAIN WHITE CONTAINER               */
    /* ================================= */

    .wiggly-container {

      width: 100%;
      min-height: 80vh;

      position: relative;

      display: flex;
      flex-direction: column;

      align-items: center;
      justify-content: center;

      gap: 28px;
      padding: 40px;

      background: #ffffff;

      border: 5px solid #DCDBBB;

      /* Organic wiggly shape */
      border-radius: 45% 55% 50% 50% / 8% 10% 12% 9%;

      /* Continuously changes the shape */
      animation: wiggle 6s ease-in-out infinite;
    }


    /* ================================= */
    /* LOGO VIDEO                        */
    /* ================================= */

    .logo-video {
      display: block;

      width: 100%;
      max-width: 520px;
      max-height: 320px;

      object-fit: contain;
    }


    /* ================================= */
    /* INTRODUCTION TEXT                  */
    /* ================================= */

    .intro {
      max-width: 700px;
    }


    /* ================================= */
    /* BUTTON GROUP                       */
    /* ================================= */

    .button-group {
      display: flex;
      flex-wrap: wrap;

      justify-content: center;
      gap: 14px;
    }


    /* ================================= */
    /* PORTFOLIO BUTTONS                  */
    /* ================================= */

    .portfolio-button {
      display: inline-block;

      padding: 12px 20px;

      border: 2px solid #34496E;
      border-radius: 999px;

      background: #7D99C9;
      color: #ffffff;

      font: inherit;
      font-size: 16px;

      text-decoration: none;
      cursor: pointer;

      transition: all 0.2s ease;
    }


    /* Button hover effect */

    .portfolio-button:hover,
    .portfolio-button:focus-visible {
      background: #34496E;
      color: #ffffff;

      transform: translateY(-2px);
    }


    /* Keyboard focus outline */

    .portfolio-button:focus-visible {
      outline: 3px solid #000000;
      outline-offset: 4px;
    }


    /* ================================= */
    /* WIGGLY CONTAINER ANIMATION         */
    /* ================================= */

    @keyframes wiggle {

      0%, 100% {
        border-radius: 45% 55% 50% 50% / 8% 10% 12% 9%;
      }

      50% {
        border-radius: 50% 45% 55% 45% / 10% 8% 9% 12%;
      }
    }


    /* ================================= */
    /* MOBILE RESPONSIVENESS              */
    /* ================================= */

    @media (max-width: 600px) {

      body {
        padding: 12px;
        font-size: 16px;
      }

      /* Makes the blue border slightly smaller */
      .portfolio-frame {
        padding: 22px;
      }

      /* Reduces the star size */
      .pixel-star {
        width: 13px;
        height: 13px;
      }

      .wiggly-container {
        min-height: 90vh;

        padding: 24px 18px;

        border-width: 4px;

        border-radius: 40% 60% 45% 55% / 6% 8% 10% 7%;

        gap: 22px;
      }

      .logo-video {
        max-height: 240px;
      }

      .portfolio-button {
        width: 100%;
        max-width: 280px;
      }
    }


    /* ================================= */
    /* REDUCED MOTION ACCESSIBILITY       */
    /* ================================= */

    @media (prefers-reduced-motion: reduce) {

      .wiggly-container {
        animation: none;
      }

      .pixel-star {
        animation: none;
      }

      .portfolio-button {
        transition: none;
      }
    }

  </style>
</head>


<body>

  <!-- ================================= -->
  <!-- OUTER BLUE FRAME                   -->
  <!-- ================================= -->

  <div class="portfolio-frame">


    <!-- Decorative pixel stars on the BLUE border -->

    <span class="pixel-star star-1" aria-hidden="true"></span>
    <span class="pixel-star star-2" aria-hidden="true"></span>
    <span class="pixel-star star-3" aria-hidden="true"></span>
    <span class="pixel-star star-4" aria-hidden="true"></span>

    <span class="pixel-star star-5" aria-hidden="true"></span>
    <span class="pixel-star star-6" aria-hidden="true"></span>

    <span class="pixel-star star-7" aria-hidden="true"></span>
    <span class="pixel-star star-8" aria-hidden="true"></span>

    <span class="pixel-star star-9" aria-hidden="true"></span>
    <span class="pixel-star star-10" aria-hidden="true"></span>
    <span class="pixel-star star-11" aria-hidden="true"></span>


    <!-- ================================= -->
    <!-- WHITE WIGGLY CONTAINER             -->
    <!-- ================================= -->

    <main class="wiggly-container">


      <!-- Animated logo video -->

      <video class="logo-video" autoplay loop muted playsinline>

        <source src="logo_animation.mp4" type="video/mp4">

        Your browser does not support the video tag.

      </video>


      <!-- Introduction -->

      <p class="intro">
        Games Development student at Belfast Met.
        Portfolio going up shortly.
      </p>


      <!-- Showreel navigation -->

      <nav class="button-group" aria-label="Showreels">

        <a class="portfolio-button" href="unreal_showreel.html">
          Unreal Showreel Here
        </a>

        <a class="portfolio-button" href="python_showreel.html">
          Python Showreel Here
        </a>

      </nav>

    </main>

  </div>

</body>
</html>
